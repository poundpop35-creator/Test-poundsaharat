name: Navigation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify internal routes and assets
        run: node --test tests/navigation-integrity.test.cjs tests/app-home.test.cjs
