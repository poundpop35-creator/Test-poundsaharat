name: Navigation integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Verify question banks, study flows, and navigation
        run: npm test
